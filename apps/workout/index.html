<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="锻炼打卡">
<title>锻炼打卡 · AI 私教</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f7cff'/%3E%3Cg fill='%23fff'%3E%3Crect x='29' y='29' width='6' height='6' rx='2'/%3E%3Crect x='20' y='22' width='7' height='20' rx='3'/%3E%3Crect x='37' y='22' width='7' height='20' rx='3'/%3E%3Crect x='12' y='28' width='5' height='8' rx='2.5' opacity='.72'/%3E%3Crect x='47' y='28' width='5' height='8' rx='2.5' opacity='.72'/%3E%3C/g%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; }
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --panel-2: #eef1f6;
  --panel-3: #e6eaf2;
  --text: #1b1f26;
  --muted: #69707d;
  --line: #e9ecf2;
  --brand: #2f7cff;
  --brand-soft: #e8f0ff;
  --ok: #17a34a;
  --ok-soft: #e7f6ec;
  --warn: #d98200;
  --warn-soft: #fdf3e2;
  --bad: #dc2626;
  --bad-soft: #fdeaea;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 26px -18px rgba(16, 24, 40, .28);
  --shadow-lift: 0 2px 4px rgba(16, 24, 40, .05), 0 16px 40px -22px rgba(16, 24, 40, .34);
  --hl: rgba(255, 255, 255, .9);
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-2: #252932;
    --panel-3: #2d323c;
    --text: #eceef3;
    --muted: #9aa2ae;
    --line: #2b3038;
    --brand: #6f9bff;
    --brand-soft: #202a3d;
    --ok: #3ccf7a;
    --ok-soft: #1b2e22;
    --warn: #f0b429;
    --warn-soft: #2f2717;
    --bad: #ff6b6b;
    --bad-soft: #33201f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px -18px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 18px 44px -24px rgba(0, 0, 0, .85);
    --hl: rgba(255, 255, 255, .06);
  }
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.62 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
h1, h2, h3 { margin: 0; font-weight: 750; }
button, input, select, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }

/* ---------- 顶栏 ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1120px; margin: 0 auto; padding: 10px 18px;
  display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.brand svg { display: block; }
.brand-sub { font-weight: 600; font-size: 11px; color: var(--brand); background: var(--brand-soft); padding: 2px 7px; border-radius: 6px; }
.tabs { display: flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 999px; margin-left: auto; }
.tab {
  border: 0; background: transparent; cursor: pointer;
  padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
  transition: background .16s ease, color .16s ease;
}
.tab:hover { color: var(--text); }
.tab.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.streak-chip {
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  font-size: 12px; font-weight: 700; color: var(--warn);
  background: var(--warn-soft); padding: 5px 11px; border-radius: 999px;
}
.help-chip { margin-left: 2px; font-size: 13.5px; font-weight: 700; }
@media (max-width: 720px) {
  .top-in { flex-wrap: wrap; gap: 8px; }
  .brand-sub { display: none; }
  .tabs { margin-left: 0; width: 100%; overflow-x: auto; }
  .tab { flex: 1; padding: 7px 8px; }
  .streak-chip { margin-left: auto; }
}

/* ---------- 布局 ---------- */
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 18px 64px; }
.grid { display: grid; grid-template-columns: minmax(300px, 380px) minmax(320px, 1fr); gap: 18px; align-items: start; }
.grid.coach { grid-template-columns: minmax(320px, 1.12fr) minmax(300px, .88fr); }
@media (max-width: 900px) { .grid.coach { grid-template-columns: 1fr; } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px; box-shadow: var(--shadow);
  min-width: 0;
}
.card-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.card-title { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; letter-spacing: .1px; }
.card-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

/* ---------- 控件 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 11px; border: 1px solid transparent; cursor: pointer;
  font-size: 13px; font-weight: 650; color: #fff; background-color: var(--brand);
  background-image: linear-gradient(180deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 62%);
  box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 18px -12px rgba(47, 124, 255, .85), inset 0 1px 0 rgba(255, 255, 255, .22);
  transition: transform .12s cubic-bezier(.2, .8, .2, 1), box-shadow .18s ease, filter .15s ease, background-color .15s ease;
  white-space: nowrap; -webkit-user-select: none; user-select: none;
}
.btn:hover:not(:disabled) { filter: brightness(1.05); box-shadow: 0 2px 4px rgba(16, 24, 40, .07), 0 12px 24px -12px rgba(47, 124, 255, .9), inset 0 1px 0 rgba(255, 255, 255, .26); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.995); box-shadow: 0 1px 2px rgba(16, 24, 40, .1), inset 0 1px 0 rgba(255, 255, 255, .12); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn.ghost {
  background-color: var(--panel); background-image: none; color: var(--text);
  border-color: var(--line); box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
}
.btn.ghost:hover:not(:disabled) { background-color: var(--panel-2); filter: none; box-shadow: 0 2px 6px rgba(16, 24, 40, .07); }
.btn.ok { background-color: var(--ok); box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 18px -12px rgba(23, 163, 74, .85), inset 0 1px 0 rgba(255, 255, 255, .2); }
.btn.ok:hover:not(:disabled) { box-shadow: 0 2px 4px rgba(16, 24, 40, .07), 0 12px 24px -12px rgba(23, 163, 74, .9), inset 0 1px 0 rgba(255, 255, 255, .24); }
.btn.bad { background-color: var(--bad); }
.btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 9px; }
.btn.block { width: 100%; }
.icon-btn {
  width: 32px; height: 32px; flex-shrink: 0; padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  font-size: 16px; line-height: 1;
}
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.tag {
  font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
  white-space: nowrap;
}
.tag.ai { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.tag.rule { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.link { border: 0; background: none; cursor: pointer; padding: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.link:hover { color: var(--text); }
.link.danger { color: var(--bad); }
input[type=text], input[type=password], input[type=number], select, textarea {
  width: 100%; padding: 9px 11px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  outline: none; transition: border-color .15s ease, background .15s ease;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); background: var(--panel); }
textarea { resize: vertical; line-height: 1.6; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field-hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.grid2f { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .grid2f { grid-template-columns: 1fr; } }

/* ---------- 日历 ---------- */
.cal-head { display: flex; align-items: center; gap: 10px; }
.cal-title { flex: 1; text-align: center; min-width: 0; }
.cal-y { font-size: 15px; font-weight: 700; }
.cal-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.week {
  display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
  font-size: 11.5px; color: var(--muted); padding: 12px 0 6px;
  max-width: 430px; margin: 0 auto;
}
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 430px; margin: 0 auto; }
.day {
  position: relative; aspect-ratio: 1 / 1; padding: 2px 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1.5px solid transparent; border-radius: 11px; cursor: pointer;
  background: var(--panel-2); color: var(--text); font-family: inherit;
  transition: background .16s ease, transform .1s ease;
}
.day:hover { background: var(--panel-3); }
.day:active { transform: scale(.94); }
.day.blank { background: transparent; cursor: default; }
.day.blank:hover { background: transparent; }
.day .n { font-size: 14px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day .lu { font-size: 8.5px; line-height: 1.15; color: var(--muted); white-space: nowrap; transform: scale(.96); }
.day .lu.fest { color: var(--bad); font-weight: 600; }
.day .lu.work { color: var(--warn); font-weight: 600; }
.day.today { background: var(--brand-soft); }
.day.today .n { color: var(--brand); }
.day.done { background: var(--ok-soft); }
.day.done .n { color: var(--ok); font-weight: 750; }
.day.done .lu { color: var(--ok); opacity: .62; }
.day.sel { border-color: var(--text); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--brand); }
.day.today.sel { box-shadow: inset 0 0 0 1.5px var(--brand); }
.day .fl { position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--panel); }
.day .fl.easy { background: var(--ok); }
.day .fl.normal { background: var(--warn); }
.day .fl.hard { background: var(--bad); }
.cal-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 11.5px; color: var(--muted); }

/* ---------- 打卡卡 ---------- */
.check-card { position: relative; overflow: hidden; }
.cc-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cc-body {
  margin-top: 10px; padding: 12px 14px; border-radius: 11px;
  background: var(--panel-2); font-size: 13px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word; color: var(--text);
  max-height: 168px; overflow-y: auto;
}
.cc-body.empty { color: var(--muted); font-style: normal; }
.cc-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
.cc-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.cc-actions .btn { flex: 1; min-width: 92px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.dot.easy { background: var(--ok); }
.dot.normal { background: var(--warn); }
.dot.hard { background: var(--bad); }

/* ---------- 计划 ---------- */
.plan-hero { display: flex; gap: 13px; margin-top: 16px; }
.plan-icon { font-size: 32px; line-height: 1; flex-shrink: 0; }
.plan-title { font-size: 19px; font-weight: 700; line-height: 1.32; }
.plan-desc { margin-top: 6px; font-size: 12.8px; line-height: 1.65; color: var(--muted); }
.phase { margin-top: 16px; }
.phase-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.phase-name { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; }
.phase-name.warm { color: var(--warn); }
.phase-name.main { color: var(--brand); }
.phase-name.cool { color: var(--ok); }
.phase-line { flex: 1; height: 1px; background: var(--line); }
.phase-count { font-size: 10.5px; color: var(--muted); }
.phase-item {
  display: flex; gap: 8px; padding: 9px 12px; border-radius: 9px;
  background: var(--panel-2); font-size: 12.8px; line-height: 1.55;
}
.phase-item + .phase-item { margin-top: 5px; }
.phase-item i { flex-shrink: 0; width: 5px; height: 5px; margin-top: 8px; border-radius: 50%; }
.phase-item i.warm { background: var(--warn); }
.phase-item i.main { background: var(--brand); }
.phase-item i.cool { background: var(--ok); }
.plan-foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.plan-note { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 11.5px; line-height: 1.6; color: var(--muted); }
.empty-state { padding: 26px 10px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.8; }

/* ---------- 私教对话（主界面） ---------- */
#app.coach-mode { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
#app.coach-mode .top { position: static; flex: 0 0 auto; }
#app.coach-mode .wrap {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  max-width: 100%; width: 100%; padding: 0;
}
.coach-app {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  width: 100%; max-width: 780px; margin: 0 auto; padding: 0 16px 12px;
}

.c-status {
  flex: 0 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 9px 2px 10px; border-bottom: 1px solid var(--line);
}
.c-status .st {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650;
  color: var(--muted); background: var(--panel-2); padding: 4px 9px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.c-status .st.on { color: var(--ok); background: var(--ok-soft); }
.c-status .st.hot { color: var(--warn); background: var(--warn-soft); }
.c-status .st-btn { cursor: pointer; font-family: inherit; border-color: var(--line); background: var(--panel); color: var(--text); }
.c-status .st-btn:hover { border-color: var(--brand); color: var(--brand); }
.c-status .sp { margin-left: auto; display: flex; gap: 6px; }

.chat-log {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 12px; padding: 14px 2px 4px;
  scrollbar-width: thin;
}
.coach-app .chat-log { min-height: 0; max-height: none; }
.c-day { align-self: center; font-size: 11px; color: var(--muted); background: var(--panel-2); padding: 3px 10px; border-radius: 999px; }
.c-msg { display: flex; gap: 8px; align-items: flex-start; }
.c-msg.user { flex-direction: row-reverse; }
.avatar {
  width: 30px; height: 30px; border-radius: 10px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff;
  background: linear-gradient(150deg, var(--brand), #6aa4ff);
  box-shadow: 0 6px 14px -8px rgba(47, 124, 255, .9);
}
.c-body { min-width: 0; max-width: min(78%, 600px); }
.bubble {
  padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.76;
  overflow-wrap: break-word;
}
.c-msg.coach .bubble {
  background: var(--panel); border: 1px solid var(--line);
  border-top-left-radius: 5px; box-shadow: var(--shadow);
}
.c-msg.user .bubble { background: var(--brand); color: #fff; border-top-right-radius: 5px; white-space: pre-wrap; }
.bubble p { margin: 0 0 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 19px; }
.bubble li { margin: 2px 0; }
.bubble .rh { font-weight: 750; margin: 10px 0 5px; font-size: 13.5px; color: var(--text); }
.bubble .rh:first-child { margin-top: 0; }
.bubble code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.bubble hr { border: 0; border-top: 1px dashed var(--line); margin: 10px 0; }
.bubble strong { font-weight: 750; }
.c-time { font-size: 10.5px; color: var(--muted); opacity: .72; margin-top: 4px; padding-left: 2px; }
.c-msg.user .c-time { text-align: right; padding-right: 2px; }

.dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .35; animation: dotPulse 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: .18s; }
.dots i:nth-child(3) { animation-delay: .36s; }
@keyframes dotPulse { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: .9; transform: translateY(-3px); } }

.acts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.act-row {
  display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
  color: var(--ok); background: var(--ok-soft); border: 1px solid rgba(23, 163, 74, .18);
  padding: 6px 9px; border-radius: 9px; line-height: 1.45;
}
.act-row.off { color: var(--muted); background: var(--panel-2); border-color: var(--line); }
.act-row .al { min-width: 0; }
.act-row .undo {
  margin-left: auto; flex: 0 0 auto; border: 0; background: none; cursor: pointer;
  font-size: 11.5px; color: var(--muted); text-decoration: underline; padding: 0 0 0 6px;
  font-family: inherit;
}
.act-row em.undo { font-style: normal; font-size: 11px; opacity: .7; text-decoration: none; }

.c-plan { margin-top: 11px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.c-plan-h {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 11px; background: var(--panel-2); font-size: 12px; font-weight: 700;
}
.c-plan-h span { font-weight: 600; color: var(--muted); font-size: 11px; }
.c-plan-b { padding: 7px 11px 3px; }
.c-plan-b .pi { display: flex; gap: 7px; font-size: 12.5px; padding: 3px 0; line-height: 1.5; color: var(--text); }
.c-plan-b .pi i { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); margin-top: 7px; flex: 0 0 auto; }
.c-plan-f { padding: 4px 11px 11px; display: flex; gap: 7px; flex-wrap: wrap; }

.c-empty {
  flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 4px; color: var(--muted); font-size: 13px; line-height: 1.7; padding: 24px 10px;
}
.c-empty .ce-ico { font-size: 28px; opacity: .5; margin-bottom: 4px; }

.composer { flex: 0 0 auto; padding-top: 8px; }
.composer .chips { display: flex; gap: 7px; flex-wrap: nowrap; overflow-x: auto; padding: 0 0 8px; scrollbar-width: none; }
.composer .chips::-webkit-scrollbar { display: none; }
.composer .chip {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-family: inherit;
  cursor: pointer; white-space: nowrap; transition: border-color .15s ease, color .15s ease;
}
.composer .chip:hover { border-color: var(--brand); color: var(--brand); }
.composer .chip:active { background: var(--brand-soft); }
.composer-row {
  display: flex; align-items: flex-end; gap: 8px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 21px; padding: 5px 5px 5px 15px;
  box-shadow: var(--shadow);
}
.composer-row:focus-within { border-color: var(--brand); }
.chat-input {
  flex: 1; min-height: 34px; max-height: 112px; padding: 7px 0; resize: none;
  border: 0; background: none; font-size: 14px; line-height: 1.55; outline: none;
  color: var(--text); font-family: inherit;
}
.send-btn {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: transform .12s ease, opacity .15s ease;
}
.send-btn:active { transform: scale(.94); }
.send-btn:disabled { opacity: .4; cursor: default; }

/* 今日计划面板 / 私教记忆 */
.modal-plan { margin-top: 12px; max-height: 44vh; overflow-y: auto; }
.modal-sec { margin-top: 14px; }
.modal-sec .card { box-shadow: none; border: 1px solid var(--line); }
.mem-list { display: flex; flex-direction: column; gap: 8px; }
.mem-row { display: flex; align-items: flex-start; gap: 10px; font-size: 12.5px; line-height: 1.6; }
.mem-row span { flex: 1; }
.mem-row .link { flex: 0 0 auto; }

@media (max-width: 720px) {
  .coach-app { padding: 0 12px calc(62px + env(safe-area-inset-bottom)); }
  .bubble { font-size: 14.5px; }
  .c-body { max-width: 84%; }
  .c-status { padding: 8px 0 9px; gap: 5px; }
  .c-status .st { font-size: 11px; padding: 4px 8px; }
  .c-status .st.lv { display: none; }
  .chat-log { padding-top: 12px; gap: 10px; min-height: 0; max-height: none; }
  .composer-row { padding: 5px 5px 5px 14px; }
  .modal-plan { max-height: 38vh; }
}

/* ---------- 分析 ---------- */
.seg { display: inline-flex; background: var(--panel-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; cursor: pointer; padding: 5px 11px;
  border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted);
}
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 9px; margin-top: 14px; }
.stat { padding: 11px 12px; border-radius: 11px; background: var(--panel-2); }
.stat-k { font-size: 11px; color: var(--muted); font-weight: 600; }
.stat-v { font-size: 21px; font-weight: 700; line-height: 1.35; font-variant-numeric: tabular-nums; }
.stat-v small { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.bars { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.bar-name { width: 40px; flex-shrink: 0; color: var(--muted); font-weight: 600; }
.bar-track { flex: 1; height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--brand); transition: width .4s ease; }
.bar-val { width: 26px; text-align: right; flex-shrink: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.brief { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
.brief-item { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.6; color: var(--text); }
.brief-item b { color: var(--brand); font-weight: 700; }
.brief-item .bi-ico { flex-shrink: 0; }
.ana-note { margin-top: 14px; }
.ana-note textarea { min-height: 66px; font-size: 13px; }
.ana-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.report {
  margin-top: 16px; min-height: 120px; font-size: 13.5px; line-height: 1.78;
  border-top: 1px solid var(--line); padding-top: 14px;
}
.report:empty { display: none; }
.report .rh {
  font-size: 13px; font-weight: 700; margin: 18px 0 7px; padding-left: 9px;
  border-left: 3px solid var(--brand); line-height: 1.35;
}
.report .rh:first-child { margin-top: 0; }
.report p { margin: 0 0 8px; }
.report ul, .report ol { margin: 0 0 10px; padding-left: 20px; }
.report li { margin: 3px 0; }
.report strong { font-weight: 700; color: var(--text); }
.report code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.report hr { border: 0; border-top: 1px dashed var(--line); margin: 12px 0; }
.report-status { margin-top: 12px; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.spinner {
  width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--line); border-top-color: var(--brand);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.report-head { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

/* ---------- 训练计时 ---------- */
.player {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  margin-top: 16px; padding: 22px 18px; border-radius: 16px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.player-top { width: 100%; display: flex; align-items: center; justify-content: space-between; }
.player-phase {
  padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
  letter-spacing: .06em; color: var(--brand); background: var(--brand-soft);
}
.player-phase.rest { color: var(--warn); background: var(--warn-soft); }
.player-phase.done { color: var(--ok); background: var(--ok-soft); }
.player-elapsed { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player-step { margin-top: 2px; font-size: 16px; font-weight: 650; line-height: 1.4; text-align: center; }
.player-clock { font-size: 52px; font-weight: 700; line-height: 1.1; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.player-progress, .player-next { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }
.player-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.planlist { margin-top: 18px; }
.planlist-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 9px;
  background: var(--panel-2); border: 1px solid transparent; font-size: 12.8px; line-height: 1.45;
}
.planlist-item + .planlist-item { margin-top: 5px; }
.planlist-item .mk { width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: var(--line); }
.planlist-item.done { opacity: .48; }
.planlist-item.done .mk { background: var(--ok); }
.planlist-item.cur { border-color: var(--brand); background: var(--panel); }
.planlist-item.cur .mk { background: var(--brand); }
.planlist-sets { flex-shrink: 0; font-size: 11px; color: var(--muted); }
.planlist-phase { margin: 12px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }

/* ---------- 设置 ---------- */
.form { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 600;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
}
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.note {
  margin-top: 12px; padding: 11px 13px; border-radius: 10px;
  background: var(--warn-soft); color: var(--warn); font-size: 12px; line-height: 1.65;
}
.note.info { background: var(--brand-soft); color: var(--brand); }
.note b { font-weight: 700; }

/* ---------- 选中日 / 使用指南 ---------- */
.day-sheet-sub { text-align: center; margin: -8px 0 12px; font-size: 12px; color: var(--muted); }
.modal.wide { max-width: 560px; }
.g-hint {
  margin-top: 10px; padding: 9px 12px; border-radius: 10px;
  background: var(--brand-soft); color: var(--brand); font-size: 12px; line-height: 1.6;
}
.gsec { border-top: 1px solid var(--line); }
.gsec:first-of-type { border-top: 0; }
.gsec > summary {
  cursor: pointer; list-style: none; padding: 12px 0;
  font-size: 13.5px; font-weight: 650; display: flex; align-items: center;
  justify-content: space-between; gap: 10px;
}
.gsec > summary::-webkit-details-marker { display: none; }
.gsec > summary::after { content: '+'; color: var(--muted); font-weight: 400; font-size: 15px; }
.gsec[open] > summary::after { content: '−'; }
.gsec[open] > summary { color: var(--brand); }
.gbody { padding: 0 0 12px; font-size: 13px; line-height: 1.72; color: var(--text); }
.gbody ul { margin: 0; padding-left: 1.15em; }
.gbody li { margin: 5px 0; }
.gbody li::marker { color: var(--brand); }
.gbody p { margin: 0 0 6px; }
.gbody code { font-size: 11.5px; padding: 1px 5px; }

/* ---------- 弹层 ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 200; padding: 20px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(12, 16, 22, .45); backdrop-filter: blur(2px);
}
.modal {
  width: 100%; max-width: 400px; padding: 18px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .3); max-height: 84vh; overflow-y: auto;
}
.modal-title { margin-bottom: 14px; font-size: 14px; font-weight: 700; text-align: center; }
.modal-foot { display: flex; gap: 10px; margin-top: 14px; }
.modal-foot .btn { flex: 1; }
.dur-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 12px; padding: 8px 11px; border-radius: 9px; font-size: 12px;
  background: var(--panel-2); border: 1px dashed var(--line);
}
.feel-list { display: flex; flex-direction: column; gap: 8px; }
.feel-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px;
  border-radius: 12px; cursor: pointer; text-align: left; font-size: 13.5px; font-weight: 600;
  border: 1px solid var(--line); background: var(--panel);
}
.feel-btn:hover { background: var(--panel-2); }
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 300;
  padding: 10px 18px; border-radius: 10px; font-size: 13px; max-width: 86vw;
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .22);
}
.hidden { display: none !important; }
/* ---------- 今日概览 hero ---------- */
.hero {
  position: relative; overflow: hidden;
  padding: 22px 22px 16px; border-radius: 22px;
  background-color: var(--panel);
  background-image: radial-gradient(125% 105% at 100% -15%, var(--brand-soft), transparent 60%);
  border: 1px solid var(--line); box-shadow: var(--shadow-lift);
}
.hero-date { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .2px; }
.hero-date .hd-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.hero-date .hd-dot.off { background: var(--muted); box-shadow: 0 0 0 3px var(--panel-2); }
.hero-title { font-size: 25px; font-weight: 800; margin-top: 11px; line-height: 1.3; letter-spacing: -.5px; }
.hero-sub { font-size: 13.5px; color: var(--muted); margin-top: 8px; max-width: 660px; line-height: 1.72; }
.hero-acts { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.hero .btn.main { padding: 12px 22px; font-size: 14px; border-radius: 12px; font-weight: 700; }
.hero-status {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--line);
}
.hs-pill {
  display: inline-flex; align-items: baseline; gap: 4px;
  font-size: 11.5px; font-weight: 600; color: var(--muted);
  background: var(--panel-2); padding: 4px 10px; border-radius: 999px;
}
.hs-pill b { font-size: 13.5px; color: var(--text); font-weight: 750; font-variant-numeric: tabular-nums; }
.hs-pill.warm { background: var(--warn-soft); color: var(--warn); }
.hs-pill.warm b { color: var(--warn); }
.hs-more {
  margin-left: auto; border: 0; background: none; cursor: pointer; padding: 2px 0;
  font-size: 11.5px; font-weight: 650; color: var(--muted);
}
.hs-more:hover { color: var(--text); }
.ring { display: block; }
.ring-text { font-size: 15px; font-weight: 750; fill: var(--text); }
.ring-sub { font-size: 8.5px; fill: var(--muted); }
.xpbar { height: 7px; border-radius: 99px; background: var(--panel-3); overflow: hidden; margin-top: 2px; }
.xpfill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--ok)); transition: width .4s ease; }
.lvline { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

/* ---------- KPI ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.kpi { background: var(--panel-2); border-radius: 12px; padding: 11px 13px; min-width: 0; }
.kpi-k { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.kpi-v { font-size: 20px; font-weight: 750; line-height: 1.3; white-space: nowrap; }
.kpi-v small { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.kpi-d { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 柱状趋势 ---------- */
.vchart { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin-top: 14px; }
.vcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
.vbar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.vbar { width: 100%; border-radius: 4px 4px 2px 2px; background: var(--panel-3); min-height: 3px; position: relative; transition: height .3s ease; }
.vbar.hot { background: var(--brand); }
.vbar.zero { background: var(--panel-2); }
.vlab { font-size: 9.5px; color: var(--muted); white-space: nowrap; }
.vbar:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel); font-size: 10px; padding: 2px 6px; border-radius: 5px; white-space: nowrap; margin-bottom: 4px; }

/* ---------- 热力图 ---------- */
.heat { display: flex; gap: 3px; overflow-x: auto; padding: 4px 0 6px; }
.heat-col { display: flex; flex-direction: column; gap: 3px; }
.heat-cell { width: 11px; height: 11px; border-radius: 2.5px; background: var(--panel-2); display: block; }
.heat-cell[lv="1"] { background: var(--brand); opacity: .3; }
.heat-cell[lv="2"] { background: var(--brand); opacity: .5; }
.heat-cell[lv="3"] { background: var(--brand); opacity: .72; }
.heat-cell[lv="4"] { background: var(--brand); opacity: 1; }
.heat-cell.out { background: transparent; }
.heat-legend { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); }
.heat-legend i { width: 11px; height: 11px; border-radius: 2.5px; display: block; }

/* ---------- 雷达 ---------- */
.radar { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; }

/* ---------- 徽章 ---------- */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 12px; }
.badge { text-align: center; padding: 12px 6px; border-radius: 12px; background: var(--panel-2); border: 1px solid transparent; position: relative; }
.badge.on { background: linear-gradient(160deg, var(--warn-soft), var(--panel-2)); border-color: var(--line); }
.badge.on { border-color: rgba(217, 130, 0, .22); }
.badge.lock { opacity: .42; filter: grayscale(1); }
.badge-ico { font-size: 22px; line-height: 1.2; }
.badge-name { font-size: 11.5px; font-weight: 700; margin-top: 4px; }
.badge-desc { font-size: 10px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.badge-cat { position: absolute; top: 6px; right: 7px; font-size: 9px; color: var(--muted); }

/* ---------- 等级卡 ---------- */
.lv-card { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.lv-num {
  width: 58px; height: 58px; border-radius: 17px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 800; letter-spacing: -.5px; color: #fff;
  background: linear-gradient(140deg, var(--brand), var(--ok));
  box-shadow: 0 8px 18px -10px rgba(47, 124, 255, .8);
}
.lv-meta { flex: 1; min-width: 200px; }
.lv-name { font-size: 16px; font-weight: 750; }
.lv-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- 身体 / PR ---------- */
.mini-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
.mini-form .field { margin: 0; flex: 1 1 90px; min-width: 80px; }
.mini-form input { padding: 8px 10px; }
.pline { width: 100%; height: 118px; display: block; }
.pr-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.pr-row:first-child { border-top: 0; }
.pr-ex { flex: 1; font-weight: 650; font-size: 13px; }
.pr-val { font-variant-numeric: tabular-nums; font-size: 13px; }
.pr-e1 { font-size: 11px; color: var(--muted); }
.pr-medal { font-size: 15px; }

/* ---------- 目标设置 ---------- */
.goal-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.goal-pill { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 650; cursor: pointer; color: var(--muted); }
.goal-pill.on { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ---------- 其它 ---------- */
.chart-tabs { display: flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 999px; }
.chart-tabs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.chart-tabs button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.subhead { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .4px; margin: 16px 0 6px; }
.subhead:first-child { margin-top: 0; }

/* ---------- 周进度点 ---------- */
.week-dots { display: flex; gap: 6px; margin-top: 12px; }
.wd { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); }
.wd span { display: block; white-space: nowrap; letter-spacing: -.2px; }
.wd i { display: block; height: 26px; border-radius: 8px; background: var(--panel-2); margin-top: 4px; }
.wd.on i { background: var(--brand); }
.wd.now i { background: var(--brand-soft); box-shadow: inset 0 0 0 1.5px var(--brand); }
.wd.now.on i { background: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }


/* ---------- 窄屏修正 ---------- */
@media (max-width: 720px) {
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { flex: 1 0 auto; padding: 7px 9px; font-size: 12.5px; white-space: nowrap; }
  .hero { padding: 16px; gap: 14px; }
  .hero-title { font-size: 19px; }
  .hero-r { width: 100%; justify-content: space-between; }
  .badge-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
}

/* =====================================================================
 *  v3：信息层级 / 质感 / 移动端
 * ===================================================================== */

.link-quiet {
  border: 0; background: none; padding: 0; cursor: pointer;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  text-decoration: underline; text-decoration-color: var(--line);
  text-decoration-thickness: 1px; text-underline-offset: 4px;
}
.link-quiet:hover { color: var(--text); text-decoration-color: var(--muted); }

/* ---- 计划折叠 ---- */
.pv-list { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.pv-item {
  display: flex; align-items: flex-start; gap: 9px; padding: 10px 13px;
  border-radius: 10px; background: var(--panel-2); font-size: 13px; line-height: 1.55;
}
.pv-item i { flex-shrink: 0; width: 5px; height: 5px; margin-top: 8px; border-radius: 50%; }
.pv-item i.warm { background: var(--warn); }
.pv-item i.main { background: var(--brand); }
.pv-item i.cool { background: var(--ok); }
.more-btn {
  display: flex; width: 100%; align-items: center; justify-content: center; gap: 5px;
  margin-top: 8px; padding: 9px 11px; border: 0; border-radius: 9px; cursor: pointer;
  background: none; font-size: 12px; font-weight: 650; color: var(--muted);
  transition: background .15s ease, color .15s ease;
}
.more-btn.split { justify-content: space-between; }
.more-btn .mb-l { font-weight: 500; font-size: 11px; opacity: .9; }
.more-btn .mb-r { display: inline-flex; align-items: center; gap: 5px; }
.more-btn:hover { background: var(--panel-2); color: var(--text); }
.more-btn svg { transition: transform .2s ease; }
.more-btn.on svg { transform: rotate(180deg); }

/* ---- 日历折叠 ---- */
.cal-card.collapsed { padding: 15px 16px 14px; }
.cal-sum {
  display: flex; width: 100%; align-items: center; justify-content: space-between;

.rp-item i { font-style: normal; color: var(--brand); font-weight: 700; width: 14px; flex-shrink: 0; }

/* ---- 底部导航 ---- */

/* ---- 页面切换 ---- */

@keyframes viewIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* 输入框 ≥16px，避免 iOS 聚焦时自动放大 */

  .badge-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
  .badge { padding: 10px 5px; }

  .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }

}

@media (max-width: 380px) {

@keyframes sheetIn { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {

/* 桌面端卡片轻微悬浮反馈 */
@media (hover: hover) and (min-width: 721px) {

<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
'use strict';
/* =========================================================================
 *  锻炼打卡 · AI 私教  —— 单文件小工具
 *  数据全部存在浏览器 localStorage；模型调用由用户在「设置」里配置。
 * ========================================================================= */
(function () {
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var FEEL = { easy: '轻松', normal: '刚好', hard: '偏难' };

  var K = {
    records: 'dsh.workout.checkin.v1',   // 与原版一致，旧记录可直接读到
    legacy: 'my_workout_ibetter',
    cfg: 'wt.ai.cfg.v1',
    profile: 'wt.ai.profile.v1',
    plan: 'wt.plan.v1',
    report: 'wt.ai.report.v1',
    chats: 'wt.chats.v1',
    thread: 'wt.coach.thread.v1',
    notes: 'wt.coach.notes.v1',
    greet: 'wt.coach.greet.v1'
  };

  /* ---------------- 小工具 ---------------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { var p = String(k).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function todayDate() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function todayKey() { return keyOf(todayDate()); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function lsGet(key, def) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : def; }
    catch (e) { return def; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 空间满或被禁用 */ }
  }
  function fmtClock(sec) {
    var s = Math.max(0, Math.floor(sec || 0));
    return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  }
  function dateCN(k) {
    var d = parseKey(k);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  /* ---------------- 记录读写 ---------------- */
  function normalizeRecord(r) {
    if (!r || typeof r !== 'object') return { done: false, content: '', feeling: null, duration: 0 };
    return {
      done: Boolean(r.done),
      content: typeof r.content === 'string' ? r.content : '',
      feeling: r.feeling === 'easy' || r.feeling === 'normal' || r.feeling === 'hard' ? r.feeling : null,
      duration: Number(r.duration) > 0 ? Math.round(Number(r.duration)) : 0,
      makeup: Boolean(r.makeup),
      at: typeof r.at === 'string' ? r.at : ''
    };
  }
  function loadRecords() {
    var raw = lsGet(K.records, null);
    if (!raw || typeof raw !== 'object') raw = lsGet(K.legacy, null);
    var out = {};
    if (raw && typeof raw === 'object') {
      Object.keys(raw).forEach(function (k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k)) out[k] = normalizeRecord(raw[k]);
      });
    }
    return out;
  }

  function streakOf(records) {
    var cur = todayDate();
    var k = keyOf(cur);
    if (!records[k] || !records[k].done) cur.setDate(cur.getDate() - 1);
    var n = 0;
    for (var guard = 0; guard < 4000; guard += 1) {
      var key = keyOf(cur);
      if (records[key] && records[key].done) { n += 1; cur.setDate(cur.getDate() - 1); }
      else break;
    }
    return n;
  }

  function bestStreak(records) {
    var keys = Object.keys(records).filter(function (k) { return records[k].done; }).sort();
    var best = 0, run = 0, prev = null;
    keys.forEach(function (k) {
      if (prev) {
        var diff = Math.round((parseKey(k) - parseKey(prev)) / 86400000);
        run = diff === 1 ? run + 1 : 1;
      } else run = 1;
      if (run > best) best = run;
      prev = k;
    });
    return best;
  }

  /* ---------------- 统计 ---------------- */
  var CATS = [
    { key: 'lower', name: '下肢', re: /深蹲|箭步|腿举|硬拉|臀|腿|提踵|爬山|登阶/ },
    { key: 'cardio', name: '有氧', re: /跑|快走|慢跑|跳绳|有氧|单车|骑行|游泳|球|波比|hiit|HIIT|椭圆/ },
    { key: 'upper', name: '上肢', re: /俯卧撑|卧推|推举|划船|引体|臂|肩|胸|背|哑铃|弹力带|飞鸟/ },
    { key: 'core', name: '核心', re: /核心|平板|卷腹|腹|俄罗斯|登山跑|死虫/ },
    { key: 'flex', name: '拉伸', re: /拉伸|瑜伽|泡沫轴|放松|按摩|筋膜/ }
  ];

  function statsFor(days) {
    var records = S.records;
    var end = todayDate();
    var entries = [];
    if (days > 0) {
      for (var i = days - 1; i >= 0; i -= 1) {
        var d = new Date(end);
        d.setDate(d.getDate() - i);
        var k = keyOf(d);
        var r = records[k] || normalizeRecord(null);
        entries.push({ date: k, weekday: d.getDay(), done: r.done, content: r.content, feeling: r.feeling, duration: r.duration });
      }
    } else {
      entries = Object.keys(records).sort().map(function (k) {
        var d = parseKey(k);
        var r = records[k];
        return { date: k, weekday: d.getDay(), done: r.done, content: r.content, feeling: r.feeling, duration: r.duration };
      });
    }
    var doneList = entries.filter(function (e) { return e.done; });
    var recorded = entries.filter(function (e) { return e.done || e.content || e.duration; }).length;
    var totalMin = entries.reduce(function (a, e) { return a + (e.duration || 0); }, 0);
    var feelings = { easy: 0, normal: 0, hard: 0 };
    entries.forEach(function (e) { if (e.feeling && feelings[e.feeling] !== undefined) feelings[e.feeling] += 1; });
    var cat = { lower: 0, cardio: 0, upper: 0, core: 0, flex: 0 };
    entries.forEach(function (e) {
      var t = e.content || '';
      CATS.forEach(function (c) { if (c.re.test(t)) cat[c.key] += 1; });
    });
    var span = days > 0 ? days : (entries.length
      ? Math.max(1, Math.round((end - parseKey(entries[0].date)) / 86400000) + 1)
      : 0);
    return {
      days: span,
      entries: entries,
      done: doneList.length,
      recorded: recorded,
      rate: span ? Math.round((doneList.length / span) * 100) : 0,
      totalMin: totalMin,
      avgMin: doneList.length ? Math.round(totalMin / doneList.length) : 0,
      feelings: feelings,
      cat: cat,
      streak: streakOf(records),
      best: bestStreak(records)
    };
  }

  /* ---------------- 轻量 Markdown ---------------- */
  function mdToHtml(text) {
    var lines = esc(text || '').split(/\r?\n/);
    var out = '';
    var list = null;
    function inline(s) {
      return s
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function closeList() { if (list) { out += '</' + list + '>'; list = null; } }
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) { closeList(); return; }
      var m;
      if ((m = /^#{1,6}\s+(.*)$/.exec(line))) { closeList(); out += '<div class="rh">' + inline(m[1]) + '</div>'; return; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { closeList(); out += '<hr>'; return; }
      if ((m = /^[-*•]\s+(.*)$/.exec(line))) {
        if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; }
        out += '<li>' + inline(m[1]) + '</li>';
        return;
      }
      if ((m = /^\d+[.、)]\s+(.*)$/.exec(line))) {
        if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; }
        out += '<li>' + inline(m[1]) + '</li>';
        return;
      }
      closeList();
      out += '<p>' + inline(line) + '</p>';
    });
    closeList();
    return out;
  }

  /* ---------------- 模型服务 ---------------- */
  var PRESETS = [
    { id: 'deepseek', name: 'DeepSeek', base: 'https://api.deepseek.com/v1', model: 'deepseek-chat', key: 'sk-' },
    { id: 'qwen', name: '通义千问', base: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus', key: 'sk-' },
    { id: 'zhipu', name: '智谱 GLM', base: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4-flash', key: '' },
    { id: 'kimi', name: 'Kimi', base: 'https://api.moonshot.cn/v1', model: 'moonshot-v1-8k', key: 'sk-' },
    { id: 'silicon', name: '硅基流动', base: 'https://api.siliconflow.cn/v1', model: 'Qwen/Qwen2.5-7B-Instruct', key: 'sk-' },
    { id: 'openai', name: 'OpenAI', base: 'https://api.openai.com/v1', model: 'gpt-4o-mini', key: 'sk-' },
    { id: 'ollama', name: 'Ollama 本地', base: 'http://localhost:11434/v1', model: 'qwen2.5:7b', key: '' }
  ];

  var DEFAULT_CFG = { preset: 'deepseek', baseUrl: PRESETS[0].base, apiKey: '', model: PRESETS[0].model, temperature: 0.6 };
  var DEFAULT_PROFILE = { sex: '', age: '', height: '', weight: '', goal: '减脂', level: '入门', freq: '3', gear: '徒手 + 哑铃', notes: '' };

  function endpointOf() {
    var base = String(S.cfg.baseUrl || '').trim().replace(/\/+$/, '');
    if (!base) throw new Error('请先在「设置」里填写接口地址');
    if (/\/chat\/completions$/.test(base)) return base;
    return base + '/chat/completions';
  }
  function isLocal(url) { return /localhost|127\.0\.0\.1|0\.0\.0\.0/.test(String(url || '')); }

  function callModel(messages, opts) {
    opts = opts || {};
    var cfg = S.cfg;
    if (!cfg.apiKey && !isLocal(cfg.baseUrl)) {
      return Promise.reject(new Error('还没有配置 API Key，请到「设置」里填写'));
    }
    var body = { model: cfg.model, messages: messages, stream: Boolean(opts.stream) };
    var t = Number(cfg.temperature);
    if (!isNaN(t)) body.temperature = Math.min(2, Math.max(0, t));
    var headers = { 'content-type': 'application/json' };
    if (cfg.apiKey) headers.authorization = 'Bearer ' + cfg.apiKey;

    return fetch(endpointOf(), {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body),
      signal: opts.signal
    }).catch(function (err) {
      if (err && err.name === 'AbortError') throw err;
      throw new Error('请求失败（可能是网络不通，或该服务不允许浏览器跨域调用）：' + (err && err.message ? err.message : '网络错误'));
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (txt) {
          var msg = txt || res.statusText || '';
          try {
            var j = JSON.parse(txt);
            if (j && j.error && j.error.message) msg = j.error.message;
            else if (j && j.message) msg = j.message;
          } catch (e) { /* 非 JSON 错误体 */ }
          throw new Error('接口返回 ' + res.status + '：' + String(msg).slice(0, 260));
        });
      }
      if (!opts.stream || !res.body || !res.body.getReader) {
        return res.json().then(function (data) {
          var txt = data && data.choices && data.choices[0] &&
            ((data.choices[0].message && data.choices[0].message.content) || data.choices[0].text);
          if (!txt) throw new Error('模型没有返回内容');
          return txt;
        });
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';
      var out = '';
      function handleLine(line) {
        line = line.trim();
        if (!line || line.indexOf('data:') !== 0) return;
        var payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') return;
        try {
          var j = JSON.parse(payload);
          var ch = j.choices && j.choices[0];
          var delta = ch && ((ch.delta && ch.delta.content) || (ch.message && ch.message.content));
          if (delta) {
            out += delta;
            if (opts.onDelta) opts.onDelta(out);
          }
        } catch (e) { /* 跳过心跳或不完整片段 */ }
      }
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) {
            if (buf) handleLine(buf);
            if (!out.trim()) throw new Error('模型没有返回内容');
            return out;
          }
          buf += decoder.decode(r.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            handleLine(buf.slice(0, idx));
            buf = buf.slice(idx + 1);
          }
          return pump();
        });
      }
      return pump();
    });
  }

  /* ---------------- 身体资料 ---------------- */
  function profileText() {
    var p = S.profile;
    var bits = [];
    if (p.sex) bits.push(p.sex);
    if (p.age) bits.push(p.age + ' 岁');
    if (p.height) bits.push('身高 ' + p.height + 'cm');
    if (p.weight) bits.push('体重 ' + p.weight + 'kg');
    if (p.goal) bits.push('目标：' + p.goal);
    if (p.level) bits.push('训练水平：' + p.level);
    if (p.freq) bits.push('每周可训练 ' + p.freq + ' 次');
    if (p.gear) bits.push('器械：' + p.gear);
    if (p.notes) bits.push('备注：' + p.notes);

    }
    var target = weekTarget();
    return {
      key: wk, done: done, mins: mins, target: target,
      left: Math.max(0, target - done),

    Object.keys(mo).forEach(function (m) { if (mo[m] > monthBest) monthBest = mo[m]; });

  function radarHtml(cat) {
    var size = 220, c0 = 110, R = 74, n = CATS.length;

    function pt(i, r) {

      return [c0 + Math.cos(a) * r, c0 + Math.sin(a) * r];
    }
    var rings = [0.25, 0.5, 0.75, 1].map(function (f) {

      for (var i = 0; i < n; i += 1) { var q = pt(i, R * f); p.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
      return '<polygon points="' + p.join(' ') + '" fill="none" style="stroke:var(--line)" stroke-width="1"/>';
    }).join('');
    var axes = '';
    for (var i = 0; i < n; i += 1) {

    }
    var poly = [], dots = '', labels = '';
    CATS.forEach(function (c, i) {

      poly.push(q[0].toFixed(1) + ',' + q[1].toFixed(1));
      dots += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.2" style="fill:var(--brand)"/>';

  function lineHtml(points) {
    if (points.length < 2) return '';

    var vals = points.map(function (p) { return p.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (max === min) { max = min + 1; min = min - 1; }
    var stepX = (size - padX * 2) / (points.length - 1);
    var xy = points.map(function (p, i) {
      return [padX + i * stepX, padY + (h - padY * 2) * (1 - (p.v - min) / (max - min))];
    });
    var d = xy.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');

  function parseStepItem(text) {
    var body = String(text || '');
    var sets = 1, rest = 0;
    var rm = /(?:组间歇|组间休息|组间|休息|间歇)\s*(\d+)\s*(秒|s|分钟|分)/i.exec(body);
    if (rm) {

      body = body.slice(0, rm.index) + ' ' + body.slice(rm.index + rm[0].length);

  /* ---------------- 某一天的记录（点月历打开） ---------------- */

      : '本月的 2 张补签卡用完了，直接打卡这一天也能记录，只是不消耗卡。';

      + (rec.content ? esc(rec.content) : (isToday ? '还没写内容。练完随手记一句，AI 分析会更准。' : (isFuture ? '还没到这一天。' : '这天还没有记录。')))

  /* ---------------- 动作协议：AI 直接改数据 ---------------- */
  function splitActs(text) {
    var raw = String(text || '');
    var acts = [];
    function take(body) {
      body.split(/\r?\n/).forEach(function (line) {
        var t = line.trim().replace(/^```$/, '').replace(/,\s*$/, '');
        if (!t || t === '[' || t === ']') return;
        try {
          var o = JSON.parse(t);
          if (o && o.type) acts.push(o);
          else if (Array.isArray(o)) o.forEach(function (x) { if (x && x.type) acts.push(x); });
        } catch (e) { /* 忽略不完整行 */ }
      });
    }
    var clean = raw.replace(/```(?:act|json)\s*\n([\s\S]*?)```/gi, function (all, body) {
      take(body);
      return '';
    });
    var open = clean.search(/```(?:act|json)/i);
    if (open >= 0) {
      take(clean.slice(open));
      clean = clean.slice(0, open);
    }
    return { text: clean.replace(/```/g, '').trim(), acts: acts };
  }

  function stripActsPartial(t) {
    var s = String(t || '');
    var i = s.search(/```(?:act|json)/i);
    return i >= 0 ? s.slice(0, i) : s;
  }

  function applyAct(a) {
    var t = String(a.type || '').toLowerCase();
    if (t === 'checkin') {
      var k = /^\d{4}-\d{2}-\d{2}$/.test(String(a.date || '')) ? a.date : todayKey();
      var prev = S.records[k] ? snap(S.records[k]) : null;
      var base = Object.assign({ done: false, content: '', feeling: null, duration: 0 }, prev || {});
      var dur = Number(a.duration);
      S.records[k] = Object.assign({}, base, {
        done: true,
        content: String(a.content || base.content || '训练').slice(0, 200),
        duration: dur > 0 ? Math.min(360, Math.round(dur)) : (base.duration || 0),
        feeling: ['easy', 'normal', 'hard'].indexOf(a.feeling) >= 0 ? a.feeling : base.feeling,
        at: new Date().toISOString()
      });
      saveRecords();
      S.sel = k;
      return {
        id: uid(), kind: 'checkin',
        label: '已记录' + (k === todayKey() ? '今天' : ' ' + dateCN(k)) + '：' + S.records[k].content
          + (S.records[k].duration ? ' · ' + S.records[k].duration + ' 分钟' : ''),
        undo: { kind: 'record', key: k, prev: prev }
      };
    }
    if (t === 'uncheckin') {
      var k2 = /^\d{4}-\d{2}-\d{2}$/.test(String(a.date || '')) ? a.date : todayKey();
      var p2 = S.records[k2] ? snap(S.records[k2]) : null;
      if (!p2) return null;
      S.records[k2] = Object.assign({}, p2, { done: false });
      saveRecords();
      return {
        id: uid(), kind: 'uncheck',
        label: '已取消' + (k2 === todayKey() ? '今天' : ' ' + dateCN(k2)) + '的打卡',
        undo: { kind: 'record', key: k2, prev: p2 }
      };
    }
    if (t === 'set_plan') {
      var prevPlan = S.plan ? snap(S.plan) : null;
      var np = normalizePlan({
        icon: a.icon || '🤖', title: a.title, desc: a.desc, type: a.type || '',
        warmup: a.warmup, main: a.main || a.items, cooldown: a.cooldown
      });
      if (!np) return null;
      S.plan = np;
      S.planFrom = 'ai';
      S.planModel = S.cfg.model || '';
      lsSet(K.plan, { date: todayKey(), plan: np, from: 'ai', model: S.cfg.model });
      return {
        id: uid(), kind: 'plan',
        label: '已更新今日计划：' + (np.title || '今日训练') + ' · ' + planCount(np),
        undo: { kind: 'plan', prev: prevPlan }
      };
    }
    if (t === 'body') {
      var prevBody = snap(S.body || []);
      var w = parseFloat(a.weight), f = parseFloat(a.fat), wa = parseFloat(a.waist);
      if (!(w > 0) && !(f > 0) && !(wa > 0)) return null;
      addBody({ weight: w > 0 ? w : '', fat: f > 0 ? f : '', waist: wa > 0 ? wa : '' });
      var bits = [];
      if (w > 0) bits.push('体重 ' + w + 'kg');
      if (f > 0) bits.push('体脂 ' + f + '%');
      if (wa > 0) bits.push('腰围 ' + wa + 'cm');
      return { id: uid(), kind: 'body', label: '已记录 ' + bits.join('、'), undo: { kind: 'body', prev: prevBody } };
    }
    if (t === 'freq') {
      var n = parseInt(a.value, 10);
      if (!(n >= 1 && n <= 7)) return null;
      var prevF = S.profile.freq;
      S.profile.freq = String(n);
      lsSet(K.profile, S.profile);
      return { id: uid(), kind: 'freq', label: '周目标已改为每周 ' + n + ' 次', undo: { kind: 'freq', prev: prevF } };
    }
    if (t === 'note') {
      var text = String(a.text || '').trim().slice(0, 120);
      if (!text) return null;
      S.notes = (S.notes || []).filter(function (x) { return x !== text; });
      S.notes.push(text);
      while (S.notes.length > 12) S.notes.shift();
      saveNotes();
      return { id: uid(), kind: 'note', label: '记住了：' + text, undo: { kind: 'note', text: text } };
    }
    return null;
  }

  function runActs(list) {
    var out = [];
    (list || []).forEach(function (a) {
      var r = null;
      try { r = applyAct(a); } catch (e) { r = null; }
      if (r) out.push(r);
    });
    return out;
  }

  function applyUndo(u) {
    if (!u) return;
    if (u.kind === 'record') {
      if (u.prev) S.records[u.key] = u.prev; else delete S.records[u.key];
      saveRecords();
      return;
    }
    if (u.kind === 'plan') {
      S.plan = u.prev;
      lsSet(K.plan, u.prev ? { date: todayKey(), plan: u.prev, from: 'ai', model: S.cfg.model } : null);
      return;
    }
    if (u.kind === 'body') { S.body = u.prev || []; saveBody(); return; }
    if (u.kind === 'freq') { S.profile.freq = String(u.prev || '3'); lsSet(K.profile, S.profile); return; }
    if (u.kind === 'note') {
      S.notes = (S.notes || []).filter(function (x) { return x !== u.text; });
      saveNotes();
    }
  }

  function undoAct(id) {
    for (var i = S.thread.length - 1; i >= 0; i -= 1) {
      var list = S.thread[i].acts || [];
      for (var j = 0; j < list.length; j += 1) {
        if (list[j].id === id && !list[j].undone) {
          applyUndo(list[j].undo);
          list[j].undone = true;
          threadSave();
          render();
          toast('已撤销');
          return;
        }
      }
    }
  }

  /* ---------------- 流式对话 ---------------- */
  function paintLive() {
    var node = document.getElementById('chat-live');
    if (!node) return;
    var txt = stripActsPartial(S.live).trim();
    node.innerHTML = txt ? mdToHtml(txt) : '<span class="dots"><i></i><i></i><i></i></span>';
    var log = document.getElementById('chat-log');
    if (log) log.scrollTop = log.scrollHeight;
  }

  function streamCoach(instruction, opts) {
    opts = opts || {};
    if (S.chatBusy || !hasKey()) return;
    S.chatBusy = true;
    S.live = '';
    render();
    var ctrl = new AbortController();
    S.chatAborter = ctrl;
    callModel(buildCoachMessages(instruction), {
      stream: true,
      signal: ctrl.signal,
      onDelta: function (txt) { S.live = txt; paintLive(); }
    }).then(function (txt) {
      finishCoach(txt, opts, instruction);
    }).catch(function (err) {
      S.chatBusy = false;
      S.chatAborter = null;
      S.live = '';
      var msg = err && err.name === 'AbortError'
        ? '（已停止）'
        : '（没能连上模型：' + (err && err.message ? err.message : '未知错误') + '）';
      threadPush({ role: 'coach', text: msg });
      render();
    });
  }

  function finishCoach(raw, opts, instruction) {
    var parts = splitActs(raw);
    var acts = runActs(parts.acts);
    threadPush({
      role: 'coach',
      text: parts.text || String(raw || '').trim(),
      acts: acts,
      plan: acts.some(function (a) { return a.kind === 'plan'; }),
      kind: opts.kind || ''
    });
    S.chatBusy = false;
    S.chatAborter = null;
    S.live = '';
    if (opts.kind === 'greet' || opts.kind === 'react') {
      S.greetDay = todayKey();
      lsSet(K.greet, S.greetDay);
    }
    render();
    if (acts.length) toast('教练已经改了你的数据');
  }

  function sendChat() {
    var text = String(S.draft || '').trim();
    if (!text || S.chatBusy) return;
    if (!hasKey()) {
      toast('先到「我的 → 模型接入」填上 API Key');
      ACTIONS['open-model']();
      return;
    }
    threadPush({ role: 'user', text: text });
    S.draft = '';
    streamCoach(text, { kind: 'chat' });
  }

  /* ---------------- 主动开口 ---------------- */
  function localGreet() {
    var s7 = statsFor(7);
    var s30 = statsFor(30);
    var rec = todayRec();
    var lines = [];
    if (rec.done) {
      lines.push('今天已经练过了' + (rec.content ? '：' + rec.content : '') + '。');
    } else if (!s30.done) {
      lines.push('你还没有训练记录。第一次不用追求强度，动 10 分钟就算正式开始。');
    } else {
      lines.push('最近 30 天你练了 ' + s30.done + ' 次、共 ' + s30.totalMin + ' 分钟，最近 7 天 ' + s7.done + ' 次。');
    }
    if (s30.done) {
      var sorted = CATS.slice().sort(function (a, b) { return s30.cat[a.key] - s30.cat[b.key]; });
      var weak = sorted[0];
      if (s30.cat[weak.key] <= 1) {
        lines.push('部位上「' + weak.name + '」几乎没排到，这是最容易补上的一块。今天加 10 分钟就够。');
      } else if (s7.done >= 5) {
        lines.push('频率已经很高了，今天更该休息——肌肉是在休息时长出来的。');
      } else {
        lines.push('节奏还算稳，下一步把每次的强度往上提一点。');
      }
    }
    lines.push('配置一个 API Key 之后，我就能读你的记录做真正的分析（在「我的 → 模型接入」）。');

  function maybeGreet(force) {
    if (S.view !== 'coach' || S.chatBusy) return;

    var last = S.thread[S.thread.length - 1];
    if (!force && last && keyOf(new Date(last.at || Date.now())) === todayKey()) {
      S.greetDay = todayKey();
      lsSet(K.greet, S.greetDay);
      return;
    }

  /* ---------------- 分析 ---------------- */
  function briefLines(s) {
    var out = [];
    out.push('这段时间有 <b>' + (s.recorded || 0) + '</b> 天留下了记录，打卡 <b>' + s.done + '</b> 天，完成率 <b>' + s.rate
      + '%</b>' + (s.rate >= 70 ? '，节奏稳。' : s.rate >= 40 ? '，有点断断续续。' : '，还没形成习惯。'));
    if (s.done > 0 && s.days > 0) {
      out.push('平均每 <b>' + (s.days / s.done).toFixed(1) + '</b> 天练一次。');
    }
    var sorted = CATS.slice().sort(function (a, b) { return s.cat[b.key] - s.cat[a.key]; });
    var most = sorted[0], least = sorted[sorted.length - 1];
    if (s.cat[most.key] > 0) {
      out.push('练得最多的是 <b>' + most.name + '</b>（' + s.cat[most.key] + ' 次）；'
        + (s.cat[least.key] === 0 ? '<b>' + least.name + '</b> 一次都没排到。' : least.name + ' 只有 ' + s.cat[least.key] + ' 次。'));
    }
    if (s.avgMin) out.push('平均每次 <b>' + s.avgMin + '</b> 分钟' + (s.avgMin < 20 ? '，偏短，热身就占掉一半。' : '。'));
    if (s.streak >= 6) out.push('已经连续 <b>' + s.streak + '</b> 天打卡，肌肉是在休息时长的，该安排恢复日了。');
    if (s.feelings.hard >= 2) out.push('有 <b>' + s.feelings.hard + '</b> 次觉得「难度过高」，强度可能给太满了。');
    if (s.done === 0) out.push('还没有有效记录，先在「打卡」里点几天，分析才有据可依。');
    return out;
  }

  function foldCard(key, title, sub, body, label) {

      + '<button class="fold-head" data-act="fold" data-key="' + key + '">'

  /* ---------------- 训练 ---------------- */
  function timerInner() {
    var step = curStep();
    var mode = SESSION.mode;
    var phaseText = mode === 'done' ? '完成' : mode === 'rest' ? '组间休息'
      : mode === 'idle' ? '准备' : (step ? step.label : '准备');
    var phaseCls = mode === 'rest' ? ' rest' : mode === 'done' ? ' done' : '';
    var clock = mode === 'done' ? fmtClock(elapsed())
      : !step ? '--:--'
        : mode === 'rest' ? fmtClock(remaining())
          : step.work > 0 ? fmtClock(remaining()) : '按次';
    var headline = mode === 'done' ? '训练结束'
      : !step ? '还没有训练计划'
        : mode === 'rest' ? '休息一下' : step.text;
    var progress = mode === 'done'
      ? SESSION.steps.length + ' 个动作 · 用时 ' + fmtClock(elapsed())
      : !step ? '先在上方生成今日计划'
        : '第 ' + (SESSION.index + 1) + '/' + SESSION.steps.length + ' 个动作'
          + (step.sets > 1 ? ' · 第 ' + SESSION.set + '/' + step.sets + ' 组' : '');
    var next = mode === 'rest' && step
      ? '下一个：' + step.text + (step.sets > 1 ? '（第 ' + SESSION.set + '/' + step.sets + ' 组）' : '')
      : '';
    var repBased = mode === 'work' && step && step.work === 0;
    var btn = function (act, cls, label, show) {
      return '<button class="btn ' + cls + '" data-act="' + act + '"' + (show ? '' : ' style="display:none"') + '>' + label + '</button>';
    };

    return '<div class="player-top"><span class="player-phase' + phaseCls + '">' + phaseText + '</span>'
      + '<span class="player-elapsed">' + fmtClock(elapsed()) + '</span></div>'
      + '<div class="player-step">' + esc(headline) + '</div>'
      + '<div class="player-clock" id="t-clock">' + clock + '</div>'
      + '<div class="player-progress" id="t-progress">' + esc(progress) + '</div>'
      + '<div class="player-next">' + esc(next) + '</div>'
      + '<div class="player-controls">'
      + btn('t-start', '', mode === 'done' ? '再来一次' : '开始训练', mode === 'idle' || mode === 'done')
      + btn('t-pause', 'ghost', '暂停', SESSION.running)
      + btn('t-resume', '', '继续', !SESSION.running && (mode === 'work' || mode === 'rest') && !repBased)
      + btn('t-set', '', '完成这组', repBased)
      + btn('t-skip', 'ghost', '跳过', !repBased && (mode === 'work' || mode === 'rest'))
      + btn('t-finish', 'bad', '结束并记录', mode !== 'idle' && mode !== 'done')
      + '</div>';
  }

  function planListHtml() {
    if (!SESSION.steps.length) {
      return '<div class="empty-state">还没有训练计划。<br>先去「打卡」页生成今天的计划。</div>';
    }
    var out = '';
    var lastPhase = '';
    SESSION.steps.forEach(function (s, i) {
      if (s.phase !== lastPhase) {
        lastPhase = s.phase;
        out += '<div class="planlist-phase">' + s.label + '</div>';
      }
      var cls = i < SESSION.index ? ' done' : i === SESSION.index ? ' cur' : '';
      out += '<div class="planlist-item' + cls + '"><span class="mk"></span>'
        + '<span style="flex:1;min-width:0">' + esc(s.text) + '</span>'
        + (s.sets > 1 ? '<span class="planlist-sets">' + s.sets + ' 组</span>' : '')
        + '</div>';
    });
    return out;
  }

        + (glist.length > 12 ? '<div class="small muted" style="margin-top:8px">还有 ' + (glist.length - 12) + ' 枚…</div>' : '')

        + '<div class="modal-foot"><button class="btn" data-act="close-modal">收下</button></div>';
    } else if (m.type === 'makeup') {
      var mdays = makeupDays();
      body = '<div class="modal-title">补签</div>'
        + '<div class="small muted" style="margin-top:4px">选一天补上。每月 2 张，用了不会掉连续天数。</div>'
        + '<div class="feel-list" style="margin-top:10px">' + mdays.map(function (k) {
          return '<button class="feel-btn" data-act="do-makeup" data-key="' + k + '">补 '
            + dateCN(k) + ' 周' + WEEK[parseKey(k).getDay()] + '</button>';
        }).join('') + '</div>'
        + '<div class="modal-foot"><button class="btn ghost" data-act="close-modal">算了</button></div>';
    } else if (m.type === 'plan') {
      body = planSheetHtml();
    } else if (m.type === 'day') {
      body = daySheetHtml();
    } else if (m.type === 'guide') {
      body = guideHtml();
    } else if (m.type === 'confirm') {
      body = '<div class="modal-title">' + esc(m.text) + '</div>'
        + '<div class="modal-foot"><button class="btn ghost" data-act="close-modal">取消</button>'
        + '<button class="btn bad" data-act="confirm-ok">' + esc(m.ok || '确定') + '</button></div>';
    }
    return '<div class="overlay" data-act="overlay">'
      + '<div class="modal' + (m.type === 'guide' ? ' wide' : '') + '" data-act="noop">' + body + '</div></div>';

  function readCfgForm() {

    var base = g('f-base').trim();
    if (base && !/^https?:\/\//i.test(base)) base = 'https://' + base;

    S.profile = {
      sex: g('f-sex'), age: g('f-age'), height: g('f-height'), weight: g('f-weight'),

    };

  function needKey() {
    if (S.cfg.apiKey || isLocal(S.cfg.baseUrl)) return true;
    toast('请先在「设置」里填写 API Key');
    S.view = 'settings';
    render();
    return false;
  }

  function runAnalysis() {
    if (S.reportBusy) return;
    if (!needKey()) return;
    markEvent('ai');
    S.reportBusy = true;
    S.liveReport = '';
    render();
    var ctrl = new AbortController();
    S.aborter = ctrl;
    callModel(buildAnalysisMessages(S.range, S.note), {
      stream: true,
      signal: ctrl.signal,
      onDelta: function (txt) {
        S.liveReport = txt;
        var node = document.getElementById('report-live');
        if (node) node.innerHTML = mdToHtml(txt);
      }
    }).then(function (text) {
      S.report = { text: text, at: Date.now(), model: S.cfg.model, range: S.range };
      lsSet(K.report, S.report);
      S.reportBusy = false;
      S.aborter = null;
      S.liveReport = '';
      render();
      toast('分析完成');
    }).catch(function (err) {
      S.reportBusy = false;
      S.aborter = null;
      render();
      if (err && err.name === 'AbortError') { toast('已停止'); return; }
      toast(err && err.message ? err.message : '分析失败');
    });
  }

  function generatePlanAI() {
    if (S.planStatus === 'loading') return;
    if (!needKey()) return;
    markEvent('plan');
    S.planStatus = 'loading';
    S.planError = '';
    render();
    callModel(buildPlanMessages(), { stream: false }).then(function (txt) {
      var plan = normalizePlan(extractJson(txt));
      if (!plan) throw new Error('模型返回的计划格式无法解析，请重新生成');
      S.plan = plan;
      S.planFrom = 'ai';
      S.planModel = S.cfg.model;
      S.planStatus = 'idle';
      lsSet(K.plan, { date: todayKey(), plan: plan, from: 'ai', model: S.cfg.model });
      render();
      toast('今日计划已生成');
    }).catch(function (err) {
      S.planStatus = 'idle';
      S.planError = err && err.message ? err.message : '生成失败';
      if (!S.plan) { S.plan = makeRulePlan(); S.planFrom = 'rule'; }
      render();
      toast('AI 生成失败：' + S.planError);
    });
  }

  function exportBackup() {
    var payload = {
      app: 'workout-checkin',
      version: 1,
      exportedAt: new Date().toISOString(),
      records: S.records,
      profile: S.profile,
      game: S.game,
      body: S.body,
      prs: S.prs
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '锻炼打卡备份-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast('已导出备份文件');
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        var recs = data.records || data;
        if (!recs || typeof recs !== 'object') throw new Error('文件格式不对');
        var count = 0;
        Object.keys(recs).forEach(function (k) {
          if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { S.records[k] = normalizeRecord(recs[k]); count += 1; }
        });
        if (data.profile) { S.profile = Object.assign({}, S.profile, data.profile); lsSet(K.profile, S.profile); }
        if (data.game && typeof data.game === 'object') {
          S.game = Object.assign(loadGame(), data.game);
          saveGame();
        }
        if (Array.isArray(data.body)) { S.body = data.body; saveBody(); }
        if (Array.isArray(data.prs)) { S.prs = data.prs; savePRs(); }
        saveRecords();
        render();
        toast('已导入 ' + count + ' 天记录');
      } catch (e) {
        toast('导入失败：' + (e.message || '文件无法解析'));
      }
    };
    reader.readAsText(file);
  }

  /* =====================================================================
   *  事件
   * ===================================================================== */
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act');
    var fn = ACTIONS[act];
    if (!fn) return;
    if (act !== 'overlay' && t.classList && t.classList.contains('overlay')) return;
    if (act !== 'noop') e.preventDefault();
    fn(t, e);
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'ana-note') S.note = t.value;
    else if (t.id === 'chat-input') S.draft = t.value;
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
    if (e.key === 'Escape' && S.modal) { S.modal = null; renderModal(); }
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'file-import' && e.target.files && e.target.files[0]) {
      importBackup(e.target.files[0]);
      e.target.value = '';
    }
  });

  function ensureHolidays(year) {
    if (holidayCache[year]) {
      Object.assign(S.holidays, holidayCache[year]);
      return;
    }
    loadHolidays(year).then(function (map) {
      if (map && Object.keys(map).length) {
        Object.assign(S.holidays, map);
        if (S.cursor.y === year) render();
      }
    });
  }

    if (['coach', 'data', 'train', 'me', 'settings'].indexOf(v) >= 0) S.view = v;
  })();

  ensureHolidays(S.cursor.y);
  if (window.Solar) S.lunarReady = true;
  else loadLunar().then(function (ok) { if (ok) { S.lunarReady = true; render(); } });

  setInterval(tick, 300);

  setTimeout(function () { maybeGreet(); }, 500);

  if (!S.plan) {
    /* 首屏先给一份本地计划，避免空白；AI 版由用户点按钮生成 */
    S.plan = makeRulePlan();
    S.planFrom = 'rule';
    render();
  }
})();
</script>
</body>
</html>
